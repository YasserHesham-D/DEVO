<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — DEVO Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav-mount"></div>

<div class="page-hero" style="padding:40px 8%">
  <h1>MY ACCOUNT</h1>
  <p>Manage your profile and track your orders</p>
</div>

<div id="guest-view" style="display:none">
  <section class="section" style="text-align:center">
    <div class="empty-state">
      <div class="empty-icon">🔒</div>
      <h3>Please Login to View Your Account</h3>
      <p>Create an account or sign in to manage your orders and profile.</p>
      <div style="display:flex;gap:1rem;justify-content:center;margin-top:2rem">
        <button class="btn btn-primary btn-lg" onclick="openModal('login-modal')">Sign In</button>
        <button class="btn btn-outline btn-lg" onclick="openModal('register-modal')">Create Account</button>
      </div>
    </div>
  </section>
</div>

<div id="account-view" style="display:none">
  <section class="section">
    <div style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:2rem;align-items:start">
      <!-- Sidebar -->
      <div>
        <div class="admin-card">
          <div style="padding:1.5rem;text-align:center;border-bottom:2px solid var(--gray-light)">
            <div style="width:80px;height:80px;background:var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem">👤</div>
            <div style="font-weight:700;font-size:1.1rem" id="acc-name">—</div>
            <div style="color:var(--gray-mid);font-size:0.85rem" id="acc-email">—</div>
          </div>
          <div style="padding:1rem">
            <button class="admin-nav-item" style="width:100%;border:none;cursor:pointer;border-radius:8px;text-align:left" onclick="showTab('orders')" id="tab-orders">📦 My Orders</button>
            <button class="admin-nav-item" style="width:100%;border:none;cursor:pointer;border-radius:8px;text-align:left" onclick="showTab('profile')" id="tab-profile">👤 Edit Profile</button>
            <button class="admin-nav-item" style="width:100%;border:none;cursor:pointer;border-radius:8px;text-align:left;color:var(--danger)!important" onclick="Auth.logout()">🚪 Logout</button>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div>
        <!-- Orders Tab -->
        <div id="tab-content-orders">
          <div class="admin-card">
            <div class="admin-card-header"><h3>📦 My Orders</h3></div>
            <div id="orders-list" style="padding:1rem">
              <div class="loader"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <!-- Profile Tab -->
        <div id="tab-content-profile" style="display:none">
          <div class="admin-card">
            <div class="admin-card-header"><h3>👤 Edit Profile</h3></div>
            <div style="padding:1.5rem">
              <form id="profile-form">
                <div class="form-group">
                  <label>Full Name</label>
                  <input type="text" id="prof-name" required>
                </div>
                <div class="form-group">
                  <label>Email Address</label>
                  <input type="email" id="prof-email" disabled style="background:var(--gray-light)">
                </div>
                <div class="form-group">
                  <label>Phone Number</label>
                  <input type="tel" id="prof-phone" placeholder="010 XXXXXXXX">
                </div>
                <div class="form-group">
                  <label>Delivery Address</label>
                  <textarea id="prof-address" rows="3" placeholder="Your default delivery address"></textarea>
                </div>
                <div class="form-group">
                  <label>New Password (leave blank to keep current)</label>
                  <input type="password" id="prof-password" placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="footer-mount"></div>
<script src="../js/components.js"></script>
<script src="../js/main.js"></script>
<script>
let currentUser = null;

function showTab(tab) {
  ['orders', 'profile'].forEach(t => {
    document.getElementById(`tab-content-${t}`).style.display = t === tab ? 'block' : 'none';
  });
}

async function loadOrders() {
  const orders = await API.get(`/orders?user_id=${currentUser.id}`);
  const container = document.getElementById('orders-list');
  if (!orders.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><h3>No orders yet</h3><p>Start shopping to see your orders here.</p><a href="/pages/shop.html" class="btn btn-primary" style="margin-top:1rem">Shop Now →</a></div>`;
    return;
  }
  container.innerHTML = `<table class="admin-table">
    <thead><tr><th>Order #</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>
    <tbody>
    ${orders.map(o => `
      <tr>
        <td><strong>#${o.id}</strong></td>
        <td>${formatDate(o.created_at)}</td>
        <td><strong>${formatPrice(o.total)}</strong></td>
        <td><span class="status-badge status-${o.status}">${o.status}</span></td>
      </tr>
    `).join('')}
    </tbody>
  </table>`;
}

function fillProfile(user) {
  document.getElementById('prof-name').value = user.name || '';
  document.getElementById('prof-email').value = user.email || '';
  document.getElementById('prof-phone').value = user.phone || '';
  document.getElementById('prof-address').value = user.address || '';
}

document.getElementById('profile-form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    name: document.getElementById('prof-name').value,
    phone: document.getElementById('prof-phone').value,
    address: document.getElementById('prof-address').value,
    password: document.getElementById('prof-password').value
  };
  await API.put(`/users/${currentUser.id}`, data);
  currentUser = { ...currentUser, ...data };
  Auth.save(currentUser);
  showToast('Profile updated! ✅', 'success');
});

document.addEventListener('DOMContentLoaded', () => {
  currentUser = Auth.get();
  if (!currentUser) {
    document.getElementById('guest-view').style.display = 'block';
  } else {
    document.getElementById('account-view').style.display = 'block';
    document.getElementById('acc-name').textContent = currentUser.name;
    document.getElementById('acc-email').textContent = currentUser.email;
    fillProfile(currentUser);
    loadOrders();
  }
});
</script>
</body>
</html>
