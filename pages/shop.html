<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — DEVO Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="nav-mount"></div>

<div class="page-hero">
  <h1>SHOP ALL SHOES</h1>
  <p>Find your perfect pair from our curated collection of premium footwear</p>
</div>

<div class="breadcrumb">
  <a href="/index.html">Home</a><span>›</span> Shop
</div>

<section class="section">
  <!-- FILTERS -->
  <div class="filter-bar">
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Search shoes...">
    </div>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">
      <span style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-dark)">Gender:</span>
      <button class="filter-btn active" data-filter="gender" data-val="">All</button>
      <button class="filter-btn" data-filter="gender" data-val="Men">Men's</button>
      <button class="filter-btn" data-filter="gender" data-val="Women">Women's</button>
      <button class="filter-btn" data-filter="gender" data-val="Unisex">Unisex</button>
      <button class="filter-btn" data-filter="gender" data-val="Kids">Kids</button>
    </div>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center">
      <span style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-dark)">Category:</span>
      <button class="filter-btn active" data-filter="category" data-val="">All</button>
      <button class="filter-btn" data-filter="category" data-val="Running">Running</button>
      <button class="filter-btn" data-filter="category" data-val="Lifestyle">Lifestyle</button>
      <button class="filter-btn" data-filter="category" data-val="Sports">Sports</button>
      <button class="filter-btn" data-filter="category" data-val="Training">Training</button>
    </div>
    <select class="filter-select" id="sort-select">
      <option value="">Sort: Default</option>
      <option value="price_asc">Price: Low to High</option>
      <option value="price_desc">Price: High to Low</option>
    </select>
    <div style="margin-left:auto;font-size:0.85rem;color:var(--gray-mid)" id="results-count"></div>
  </div>

  <div class="products-grid" id="shop-products">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="../js/components.js"></script>
<script src="../js/main.js"></script>
<script>
let filters = { gender: '', category: '', search: '', sort: '' };

async function loadProducts() {
  const container = document.getElementById('shop-products');
  container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  
  const params = new URLSearchParams();
  if (filters.gender) params.set('gender', filters.gender);
  if (filters.category) params.set('category', filters.category);
  if (filters.search) params.set('search', filters.search);
  if (filters.sort) params.set('sort', filters.sort);

  const products = await API.get('/products?' + params.toString());
  const countEl = document.getElementById('results-count');
  countEl.textContent = `${products.length} result${products.length !== 1 ? 's' : ''}`;

  if (!products.length) {
    container.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">👟</div><h3>No shoes found</h3><p>Try adjusting your filters</p></div>`;
    return;
  }

  container.innerHTML = products.map(p => {
    const price = p.sale_price ? p.sale_price : p.price;
    const badge = p.sale_price ? '<span class="product-badge sale">SALE</span>' : (p.featured ? '<span class="product-badge">HOT</span>' : '');
    return `
      <a href="/pages/product.html?id=${p.id}" class="product-card">
        <div class="product-card-img-wrap">
          <img class="product-card-img" src="${p.image_url}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600'">
          ${badge}
        </div>
        <div class="product-card-body">
          <div class="product-card-category">${p.category} · ${p.gender}</div>
          <div class="product-card-name">${p.name}</div>
          <div class="product-card-price">
            <span class="price-current ${p.sale_price ? 'price-sale' : ''}">${formatPrice(price)}</span>
            ${p.sale_price ? `<span class="price-original">${formatPrice(p.price)}</span>` : ''}
          </div>
        </div>
      </a>`;
  }).join('');
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.filter;
    document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filters[type] = btn.dataset.val;
    loadProducts();
  });
});

// Search
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filters.search = e.target.value; loadProducts(); }, 400);
});

// Sort
document.getElementById('sort-select').addEventListener('change', e => {
  filters.sort = e.target.value;
  loadProducts();
});

// Read URL params
function readURLParams() {
  const params = new URLSearchParams(window.location.search);
  const gender = params.get('gender');
  const category = params.get('category');
  
  if (gender) {
    filters.gender = gender;
    document.querySelectorAll('[data-filter="gender"]').forEach(b => {
      b.classList.toggle('active', b.dataset.val === gender);
    });
  }
  if (category) {
    filters.category = category;
    document.querySelectorAll('[data-filter="category"]').forEach(b => {
      b.classList.toggle('active', b.dataset.val === category);
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  readURLParams();
  loadProducts();
});
</script>
</body>
</html>
