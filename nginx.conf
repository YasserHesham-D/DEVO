server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Serve .wasm files with correct MIME type (required for sql.js)
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
